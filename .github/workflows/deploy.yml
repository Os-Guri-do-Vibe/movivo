# =============================================================================
# MOVIVO — Deploy de produção (GitHub Actions → GHCR → VPS Hostinger)
# =============================================================================
# Dono: Henrique (Platform/SRE)
#
# Todo push no main (que só recebe merge com o CI verde — branch protection):
#   1. images  constrói api e web com os Dockerfiles do repo e publica no GHCR
#              com tag = SHA curto (a mesma que o infra/vps/deploy.sh usa).
#   2. deploy  roda infra/vps/deploy.sh <sha> contra a VPS: a VPS só faz pull.
#
# Secrets do environment `production` (ver docs/operacoes/deploy-producao.md):
#   VPS_SSH_KEY      chave ed25519 dedicada ao Actions (authorized_keys do deploy)
#   VPS_KNOWN_HOSTS  linha(s) do `ssh-keyscan` da VPS — nunca desligar a checagem
# O GITHUB_TOKEN do job basta para publicar e puxar do GHCR.
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez e nenhum cancelado no meio (migração em curso não se interrompe).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: image (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* é gravado no bundle no build: trocar domínio = nova imagem.
      # A imagem da API ignora esses build args.
      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/os-guri-do-vibe/movivo-${{ matrix.app }}:${{ steps.tag.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_SITE_URL=https://movivo.com.br
            NEXT_PUBLIC_API_URL=https://api.movivo.com.br/api/v1
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Chave SSH da VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: infra/vps/deploy.sh "${GITHUB_SHA::7}"
