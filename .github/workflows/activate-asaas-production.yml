name: Ativar Asaas de produção

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Chave SSH da VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Trocar conta Asaas com rollback
        env:
          ASAAS_PRODUCTION_API_KEY: ${{ secrets.ASAAS_PRODUCTION_API_KEY }}
          ASAAS_PRODUCTION_WEBHOOK_TOKEN: ${{ secrets.ASAAS_PRODUCTION_WEBHOOK_TOKEN }}
        run: bash infra/vps/activate-asaas-production.sh
