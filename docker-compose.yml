# =============================================================================
# MOVIVO — Ambiente local reprodutível (dados + aplicação, espelho da produção)
# =============================================================================
# Dono: Henrique Matsuda (Platform Engineering / SRE) · US-0.2 · Sprint 0
# Requisitos de origem:
#   · sprint/sprint-0-fundacao.md — US-0.2, TASK-0.2.1 a 0.2.4
#   · docs/arquitetura/ARQUITETURA.md §2 (stack), §8 (segurança), §12 (regras)
#   · docs/fitness-ia-whatsapp/11-relatorio-sato.md §4.3 e §9 (hardening)
#   · docs/SECURITY.md (US-0.6) — contrato de Docker Secrets e `*_FILE`
#
# ─── COMO SUBIR ──────────────────────────────────────────────────────────────
#   1. bash scripts/gen-local-secrets.sh            (ou o .ps1 no Windows)
#   2. cp .env.example .env
#   3. colocar em secrets/desenvolvimento/ as chaves de terceiros (asaas, openai, deepseek,
#      anthropic, groq — exclusivas de desenvolvimento)
#   4. pnpm run infra:up          (equivalente: make up)
#
#   O `up` constrói as imagens da API e do web a partir dos MESMOS Dockerfiles da
#   produção, migra o banco e sobe tudo: http://localhost:3000 (web) e
#   http://localhost:3001/api/v1 (API). A API lê o MESMO `infra/vps/api.env` da
#   VPS — só as URLs mudam (bloco `environment:` do serviço, que tem precedência).
#   Diferenças inevitáveis em relação à produção: sem Nginx/TLS/Cloudflare (o
#   browser fala direto com web e API em http://localhost) e portas publicadas
#   em 127.0.0.1.
#
#   Hot reload: os serviços `migrate`/`api`/`web` pertencem ao profile `app`
#   (ativado por COMPOSE_PROFILES=app no .env). Para rodar API/web no host com
#   `pnpm dev`, pare-os (`docker compose stop api web`) ou deixe o profile vazio
#   (COMPOSE_PROFILES= no .env) — o CI faz isso, só precisa da camada de dados.
#
#   O bloco top-level `secrets:` continua morando em `docker-compose.secrets.yml`
#   (contrato da US-0.6, referenciado por docs/SECURITY.md §2.4) e é puxado pelo
#   `include:` abaixo — assim `docker compose <qualquer comando>` funciona sem
#   repetir `-f ... -f ...`, e o inventário de secrets segue com um dono e um
#   arquivo só. `docker compose -f docker-compose.yml -f docker-compose.secrets.yml`
#   também continua válido (o merge é idempotente).
#
# ─── REGRAS INEGOCIÁVEIS MATERIALIZADAS AQUI ─────────────────────────────────
#   · Nenhum valor sensível em `environment:` — só caminhos para /run/secrets/*.
#   · Redis em versão com o patch da CVE-2025-49844 (RediShell). Nunca rebaixar.
#   · A aplicação fala com o Postgres SOMENTE pela 5433 (PgBouncer).
#   · API e web rodam como na VPS: mesma imagem (Dockerfile), NODE_ENV=production,
#     usuário não-root, segredos só por /run/secrets/*.
#   · `movivo_app` sem BYPASSRLS e sem ownership de tabela.
#   · Nenhuma porta publicada em 0.0.0.0 — tudo em 127.0.0.1.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-movivo}

# Fonte única e canônica do inventário de Docker Secrets (US-0.6/TASK-0.6.2).
# Nunca redeclarar um `secrets:` top-level aqui: o arquivo incluído é o contrato.
include:
  - docker-compose.secrets.yml

# ─────────────────────────────────────────────────────────────────────────────
# Âncoras reutilizadas (YAML anchors): mantêm as políticas operacionais
# idênticas entre serviços e impedem que uma delas seja esquecida em um serviço
# novo.
# ─────────────────────────────────────────────────────────────────────────────
x-common: &common
  restart: unless-stopped
  networks: [movivo-net]
  # Impede que um processo dentro do container ganhe privilégios via binário
  # setuid — hardening barato e sem efeito colateral nestas imagens.
  security_opt:
    - no-new-privileges:true
  # Logs limitados: sem isto, um loop de erro enche o disco do dev/da VPS.
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # ===========================================================================
  # TASK-0.2.1 — PostgreSQL 17 + PGVector
  # ===========================================================================
  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: movivo-postgres
    # `environment` contém APENAS nomes, caminhos e parâmetros não sensíveis.
    # A senha do superusuário entra por POSTGRES_PASSWORD_FILE (suporte nativo
    # da imagem oficial) — docs/SECURITY.md §2.4.
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-movivo}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      # Checksums de página: detecta corrupção silenciosa de I/O. Só pode ser
      # ligado no initdb — depois exige recriar o cluster.
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Consumidos pelo 02-roles.sh (nomes de role, não segredos).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-movivo_app}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-movivo_migrator}
      TZ: ${TZ:-America/Sao_Paulo}
      # UTC no servidor: toda conversão de fuso é responsabilidade da aplicação.
      # Guardar timestamp em fuso local é a origem clássica de bug no check-in
      # semanal (seg 08–10h BRT).
      PGTZ: UTC
    secrets:
      - postgres_superuser_password
      - postgres_app_password
      - postgres_migrator_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Somente-leitura: o init nunca deve poder ser reescrito de dentro do
      # container. Roda UMA vez, no primeiro boot do volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 127.0.0.1 explícito: publicar em 0.0.0.0 exporia o banco na LAN (e, numa
      # VPS, na internet — o Docker escreve regras de iptables ANTES do UFW).
      #
      # POR QUE A 5432 É PUBLICADA, se a regra #3 diz "a app nunca fala na 5432":
      # esta porta existe EXCLUSIVAMENTE para o caminho de MIGRAÇÃO
      # (drizzle-kit, role `movivo_migrator`, US-0.4) e para o psql de
      # depuração. drizzle-kit usa DDL + advisory locks de sessão, que NÃO
      # sobrevivem ao transaction pooling do PgBouncer — por isso migração é a
      # única exceção, já documentada em .env.example §3 (US-0.6).
      # O RUNTIME da API (`movivo_app`) usa 5433 e só 5433.
      - '127.0.0.1:${HOST_POSTGRES_PORT:-5432}:5432'
    # /dev/shm padrão do Docker é 64MB e estoura em hash join/parallel query.
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # Log de queries lentas: baseline de performance desde o dia 1, barato.
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - track_io_timing=on
      # scram-sha-256 explícito: é o default no PG17, mas o PgBouncer depende
      # dele (auth_type = scram-sha-256) e um downgrade silencioso quebraria a
      # autenticação de forma difícil de diagnosticar.
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      # `pg_isready` só responde OK depois que o entrypoint terminou TODO o
      # /docker-entrypoint-initdb.d/ e abriu o listener TCP definitivo — logo,
      # este healthcheck também prova que as extensões e as roles foram criadas.
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      # Generoso: o primeiro boot roda initdb + extensões + roles.
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M

  # ===========================================================================
  # TASK-0.2.2 — PgBouncer (transaction mode, porta 5433)
  # ===========================================================================
  pgbouncer:
    <<: *common
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.24.1-p1}
    container_name: movivo-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    # Nenhuma env de configuração: o entrypoint da imagem só autogera o
    # pgbouncer.ini quando ele NÃO existe. Como montamos o nosso, a configuração
    # é 100% a do repositório — revisável em code review, sem surpresa.
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    secrets:
      - pgbouncer_userlist
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      # ESTA é a porta que a aplicação usa. Sempre.
      - '127.0.0.1:${HOST_PGBOUNCER_PORT:-5433}:5433'
    healthcheck:
      # Contra o próprio pooler: prova que o PgBouncer está aceitando conexão.
      # Não valida credencial de propósito (pg_isready para no auth request) —
      # um healthcheck que autentica precisaria da senha no comando, e ela
      # apareceria em `docker inspect`.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5433 -U movivo_app -d movivo']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M

  # ===========================================================================
  # TASK-0.2.3 — Redis MASTER (patcheado contra CVE-2025-49844 / RediShell)
  # ===========================================================================
  redis-master:
    <<: *common
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    container_name: movivo-redis-master
    # `$$` escapa a interpolação do Compose: quem deve expandir `$(cat ...)` é o
    # shell DENTRO do container, no boot, e não o Compose no host.
    command:
      - sh
      - -c
      - |
        set -eu
        test -s /run/secrets/redis_password || {
          echo "[movivo/redis] ERRO FATAL: /run/secrets/redis_password ausente ou vazio." >&2
          echo "[movivo/redis] Rode scripts/gen-local-secrets.(sh|ps1) antes do up." >&2
          exit 1
        }
        umask 077
        sed "s|@REDIS_PASSWORD@|$$(cat /run/secrets/redis_password)|g" \
          /etc/movivo/redis-master.conf.tpl > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    secrets:
      - redis_password
    volumes:
      - redis-master-data:/data
      - ./infra/redis/redis-master.conf.tpl:/etc/movivo/redis-master.conf.tpl:ro
    ports:
      # Só loopback, e só para conveniência de `redis-cli` em dev.
      # Em produção nenhuma porta do Redis é publicada (Sato: bind interno).
      - '127.0.0.1:${HOST_REDIS_PORT:-6379}:6379'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 768M
        reservations:
          memory: 128M

  # ===========================================================================
  # TASK-0.2.3 — Redis REPLICA
  # ===========================================================================
  redis-replica:
    <<: *common
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    container_name: movivo-redis-replica
    depends_on:
      redis-master:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        test -s /run/secrets/redis_password || {
          echo "[movivo/redis] ERRO FATAL: /run/secrets/redis_password ausente ou vazio." >&2
          exit 1
        }
        umask 077
        sed "s|@REDIS_PASSWORD@|$$(cat /run/secrets/redis_password)|g" \
          /etc/movivo/redis-replica.conf.tpl > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    secrets:
      - redis_password
    volumes:
      - redis-replica-data:/data
      - ./infra/redis/redis-replica.conf.tpl:/etc/movivo/redis-replica.conf.tpl:ro
    ports:
      # Publicada para que uma API rodando NO HOST consiga alcançar a réplica
      # caso o Sentinel a promova a master. Sem isso, o `natMap` do ioredis
      # (ver README) não teria para onde apontar depois de um failover.
      - '127.0.0.1:${HOST_REDIS_REPLICA_PORT:-6380}:6379'
    healthcheck:
      # PING não basta: uma réplica sobe e responde PONG mesmo sem conseguir
      # falar com o master. `master_link_status:up` é o que realmente prova a
      # replicação — sem isso o serviço ficaria "healthy" mentindo.
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" info replication | grep -q ''master_link_status:up''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 768M
        reservations:
          memory: 128M

  # ===========================================================================
  # TASK-0.2.3 — Redis SENTINEL (quorum=2 — ver nota em sentinel.conf.tpl)
  # ===========================================================================
  redis-sentinel:
    <<: *common
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    container_name: movivo-redis-sentinel
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        test -s /run/secrets/redis_password || {
          echo "[movivo/sentinel] ERRO FATAL: /run/secrets/redis_password ausente ou vazio." >&2
          exit 1
        }
        umask 077
        # O Sentinel REESCREVE seu próprio arquivo de config em runtime (CONFIG
        # REWRITE após descobrir réplicas / em failover). Por isso o arquivo
        # efetivo fica em /tmp (gravável) e o template em bind mount read-only.
        sed "s|@REDIS_PASSWORD@|$$(cat /run/secrets/redis_password)|g" \
          /etc/movivo/sentinel.conf.tpl > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    secrets:
      - redis_password
    volumes:
      - ./infra/redis/sentinel.conf.tpl:/etc/movivo/sentinel.conf.tpl:ro
    ports:
      - '127.0.0.1:${HOST_SENTINEL_PORT:-26379}:26379'
    healthcheck:
      # Prova o que interessa: o Sentinel conhece e está monitorando o master
      # com o nome que a aplicação usa (REDIS_SENTINEL_MASTER_NAME).
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" -p 26379 sentinel master ${REDIS_SENTINEL_MASTER_NAME:-movivo-master} | grep -qx ''${REDIS_SENTINEL_MASTER_NAME:-movivo-master}''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 96M
        reservations:
          memory: 32M

  # ===========================================================================
  # EvolutionAPI — transporte WhatsApp configurado para esta instalação.
  # Banco próprio isolado do schema MOVIVO (RLS forçada e roles restritas).
  # ===========================================================================
  evolution-postgres:
    <<: *common
    image: ${EVOLUTION_POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: movivo-evolution-postgres
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
      POSTGRES_PASSWORD_FILE: /run/secrets/evolution_postgres_password
      TZ: ${TZ:-America/Sao_Paulo}
      # A partir da 18, a imagem oficial passou a esperar os dados num subdiretório
      # compatível com `pg_ctlcluster` (docker-library/postgres#1259) — montar o volume
      # direto na raiz `/var/lib/postgresql/data` faz o entrypoint recusar subir, mesmo
      # em volume novo/vazio. `PGDATA` aponta pra um subcaminho dentro do MESMO volume,
      # sem mudar o mapeamento de `volumes:` abaixo.
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - evolution_postgres_password
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${HOST_EVOLUTION_POSTGRES_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M

  evolution-api:
    <<: *common
    # v2.1.1 tinha um bug documentado (GitHub issue #2430 do evolution-api): o QR nunca
    # nascia porque o handler de reconexão disparava antes da primeira geração de QR,
    # criando loop infinito ("Conectando" pra sempre, /instance/connect sempre {count:0}).
    # Corrigido na v2.3.7 — fixado (não `latest`) pra não herdar quebras futuras sem querer.
    image: ${EVOLUTION_API_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: movivo-evolution-api
    depends_on:
      evolution-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: '8080'
      SERVER_URL: http://localhost:${HOST_EVOLUTION_PORT:-8081}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      # Cache em memória (não Redis): evita ter que interpolar a senha do Redis
      # compartilhado dentro de uma connection string — o contrato `*_FILE` deste
      # projeto injeta segredo como arquivo, não como parte de uma URL montada.
      # Cache local é suficiente para uma ferramenta de teste de um usuário só.
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      TZ: ${TZ:-America/Sao_Paulo}
    secrets:
      - evolution_api_key
      - evolution_postgres_password
    # A imagem não lê `*_FILE` nativamente (convenção só das imagens oficiais
    # Postgres/Redis) — o wrapper injeta os segredos como env var no boot, sem
    # nunca passar por `environment:` (docker inspect), e preserva o ENTRYPOINT
    # real da imagem (verificado via `docker inspect`) no `exec` final.
    entrypoint: []
    command:
      - bash
      - -c
      - |
        set -eu
        test -s /run/secrets/evolution_api_key || {
          echo "[movivo/evolution-api] ERRO FATAL: /run/secrets/evolution_api_key ausente." >&2
          echo "[movivo/evolution-api] Rode scripts/gen-local-secrets.(sh|ps1) antes do up." >&2
          exit 1
        }
        export AUTHENTICATION_API_KEY="$$(cat /run/secrets/evolution_api_key)"
        export DATABASE_CONNECTION_URI="postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:$$(cat /run/secrets/evolution_postgres_password)@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}"
        exec bash -c ". ./Docker/scripts/deploy_database.sh && npm run start:prod"
    volumes:
      - evolution-instances:/evolution/instances
    # A EvolutionAPI precisa ALCANÇAR O HOST em dois caminhos: baixar o PDF do protocolo
    # (`media` como URL) e ENTREGAR o webhook de entrada na API (US-3.1-EVO), ambos em
    # `http://localhost:PORTA` do ponto de vista de quem roda no host. Dentro do container,
    # `localhost` é o próprio container — por isso o backend reescreve para
    # `host.docker.internal` (`toContainerReachableUrl`). Esse hostname existe nativamente
    # no Docker Desktop (macOS/Windows) mas NÃO no Docker Engine do Linux/CI: `host-gateway`
    # cria o mapeamento lá. No Desktop é redundante e inofensivo.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${HOST_EVOLUTION_PORT:-8081}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          memory: 128M

  # ===========================================================================
  # Aplicação — espelho de infra/vps/docker-compose.prod.yml (profile `app`)
  # ===========================================================================
  # One-shot: aplica as migrações e reconcilia os grants de `movivo_app`, igual ao
  # deploy da VPS (que roda `docker compose run --rm migrate` ANTES de trocar a
  # API). Aqui a API só sobe depois que ele termina com sucesso. Único serviço que
  # recebe a senha do `movivo_migrator`. Usa a imagem construída pelo serviço `api`.
  migrate:
    profiles: [app]
    image: &api-image movivo-api:local
    pull_policy: never
    container_name: movivo-migrate
    restart: 'no'
    networks: [movivo-net]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: local
      DATABASE_NAME: ${POSTGRES_DB:-movivo}
      DATABASE_USER: ${POSTGRES_APP_USER:-movivo_app}
      MIGRATION_DATABASE_HOST: postgres
      MIGRATION_DATABASE_PORT: '5432'
      MIGRATION_DATABASE_USER: ${POSTGRES_MIGRATOR_USER:-movivo_migrator}
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/postgres_migrator_password
      # Somente runtime: migração criptografa destinos de links já existentes.
      PGCRYPTO_KEY_FILE: /run/secrets/pgcrypto_key
    secrets:
      - postgres_migrator_password
      - pgcrypto_key
    command: ['node', '--enable-source-maps', 'dist/core/database/migrate.js']

  api:
    <<: *common
    profiles: [app]
    image: *api-image
    # Mesmo Dockerfile e mesmo contexto (raiz do monorepo) da produção.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: movivo-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    # Fonte ÚNICA da configuração da API: o arquivo da VPS. Nada é duplicado aqui;
    # o que muda no local está em `environment:` logo abaixo (precedência maior).
    env_file: [infra/vps/api.env]
    environment:
      APP_ENV: local
      LOG_LEVEL: debug
      # Origens do browser em http://localhost (sem Nginx/TLS na frente).
      API_CORS_ORIGINS: https://localhost:${HOST_WEB_PORT:-3000}
      PUBLIC_SITE_URL: https://localhost:${HOST_WEB_PORT:-3000}
      # Base pública DA API: é a URL que a EvolutionAPI (outro container) chama de
      # volta no webhook e de onde baixa o PDF do protocolo — por isso o nome do
      # serviço, e não localhost (que dentro do container é ele mesmo).
      API_PUBLIC_URL: http://api:3001
    secrets:
      - postgres_app_password
      - redis_password
      - pgcrypto_key
      - jwt_private_key
      - jwt_public_key
      - evolution_api_key
      - evolution_webhook_token
      - asaas_api_key
      - asaas_webhook_secret
      - deepseek_api_key
      - openai_api_key
      - anthropic_api_key
      - groq_api_key
    volumes:
      # Fotos de perfil (AVATAR_UPLOAD_DIR=./uploads/avatars, cwd /app/apps/api).
      # É o mesmo diretório que a API usa quando roda no host — as fotos já
      # enviadas continuam valendo. Dado de runtime: nunca apagar em "limpeza".
      - ./apps/api/uploads:/app/apps/api/uploads
    ports:
      - '127.0.0.1:${HOST_API_PORT:-3001}:3443'
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  web:
    <<: *common
    profiles: [app]
    image: movivo-web:local
    # Mesmo Dockerfile da produção. NEXT_PUBLIC_* é gravado no bundle NO BUILD:
    # aqui apontam para localhost; na VPS, para os domínios (deploy.sh).
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: local
        NEXT_PUBLIC_SITE_URL: https://localhost:${HOST_WEB_PORT:-3000}
        NEXT_PUBLIC_API_URL: https://localhost:${HOST_API_PORT:-3001}/api/v1
        # Vazia em dev: login e dashboard rodam no mesmo host do site.
        NEXT_PUBLIC_ADMIN_URL: ''
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    container_name: movivo-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # BFF do dashboard fala com a API pela rede interna, como na VPS.
      MOVIVO_API_URL: http://api:3001/api/v1
    ports:
      - '127.0.0.1:${HOST_WEB_PORT:-3000}:3444'
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

# ─────────────────────────────────────────────────────────────────────────────
networks:
  movivo-net:
    name: movivo-net
    driver: bridge

volumes:
  postgres-data:
    name: movivo-postgres-data
  redis-master-data:
    name: movivo-redis-master-data
  redis-replica-data:
    name: movivo-redis-replica-data
  evolution-postgres-data:
    name: movivo-evolution-postgres-data
  evolution-instances:
    name: movivo-evolution-instances
