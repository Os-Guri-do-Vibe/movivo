<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Satoshi;src:url(Satoshi-700.woff2);font-weight:700}
html,body{margin:0;width:1080px;height:300px;background:transparent;overflow:hidden}
#c{position:absolute;left:70px;right:70px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:Satoshi;font-weight:700;font-size:54px;line-height:1.18;letter-spacing:-.4px;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.35)}
.w{display:inline-block;margin:0 .02em}
.past{color:#f4f7f3}.now{color:#ff6a3d}.next{color:rgba(244,247,243,.5)}
</style></head><body><div id="c"></div>
<script>window.show=(ws,k)=>{document.getElementById('c').innerHTML='<div>'+ws.map((w,i)=>`<span class="w ${i<k?'past':i===k?'now':'next'}">${w}</span>`).join(' ')+'</div>'}</script></body></html>
