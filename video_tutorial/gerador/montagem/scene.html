<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Satoshi;src:url(Satoshi-500.woff2);font-weight:500}
@font-face{font-family:Satoshi;src:url(Satoshi-700.woff2);font-weight:700}
@font-face{font-family:Cabinet;src:url(CabinetGrotesk-800.woff2);font-weight:800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
.bg{position:absolute;inset:0;background:
  radial-gradient(900px 900px at 50% 42%, rgba(37,226,126,.13), rgba(37,226,126,0) 70%),
  radial-gradient(1400px 1600px at 50% 40%, #0a4238 0%, #06302a 55%, #031c18 100%)}
.grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:6px 6px}
#logo{position:absolute;left:130px;width:820px;height:213px;overflow:visible}
.txt{position:absolute;left:0;right:0;text-align:center;font-family:Satoshi;color:#f4f7f3}
#tag{font-weight:500;font-size:50px;letter-spacing:-.5px}
#url{font-family:Cabinet;font-weight:800;font-size:92px;letter-spacing:-1px;color:#fff}
#cta{left:50%;right:auto;transform:translateX(-50%);background:#25e27e;color:#06302a;font-weight:700;
  font-size:38px;letter-spacing:3px;padding:30px 56px;border-radius:999px;white-space:nowrap}
#cref{font-weight:500;font-size:31px;line-height:1.45;color:rgba(244,247,243,.72);padding:0 120px}
#cref b{color:#25e27e;font-weight:700}
/* moldura do celular: fundo + aparelho com o vão da tela transparente */
#device{position:absolute;background:linear-gradient(160deg,#1c2a26,#070c0a 40%,#0d1613);left:111px;top:47px;width:858px;height:1826px;border-radius:114px;
  box-shadow:0 40px 110px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.07),0 0 160px rgba(37,226,126,.14)}
#fw{position:absolute;inset:0}
.holed{-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><path fill-rule='evenodd' fill='white' d='M0 0H1080V1920H0Z M225 61H855A100 100 0 0 1 955 161V1759A100 100 0 0 1 855 1859H225A100 100 0 0 1 125 1759V161A100 100 0 0 1 225 61Z'/></svg>");mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><path fill-rule='evenodd' fill='white' d='M0 0H1080V1920H0Z M225 61H855A100 100 0 0 1 955 161V1759A100 100 0 0 1 855 1859H225A100 100 0 0 1 125 1759V161A100 100 0 0 1 225 61Z'/></svg>")}
</style></head>
<body><div id='fw'>
<div class="bg" id="bgl"></div><div class="grain" id="grain"></div>
<svg id="logo" viewBox="0 0 1000 260">
  <defs><clipPath id="wipe"><rect id="wr" x="0" y="0" width="0" height="260"/></clipPath>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g id="all">
    <g clip-path="url(#wipe)"><path id="sym" transform="translate(-10 -5)" fill="#25E27E" filter="url(#glow)"/></g>
    <g id="letters" fill="#f9fafa"></g>
    <circle id="dot" cx="743" cy="68" r="12.5" fill="#25E27E"/>
  </g>
</svg>
<div class="txt" id="tag">Move your potential.</div>
<div class="txt" id="url">movivo.com.br</div>
<div class="txt" id="cta">7 DIAS GRÁTIS · SEM CARTÃO</div>
<div class="txt" id="cref">Treino individualizado por <b>profissional de Educação Física com CREF</b>, usando IA como ferramenta.</div>
<div id="device"></div></div>
<script>
const P = window.LOGO;
document.getElementById('sym').setAttribute('d', P.symbol);
const lg = document.getElementById('letters');
const letters = P.letters.map(d => { const p = document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d', d); lg.appendChild(p); return p; });
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c1=1.9, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const seg = (t,a,b) => (t-a)/(b-a);
function show(el, o, dy=0){ el.style.opacity = o; el.style.translate = `0 ${dy}px`; }

// mode: 'intro' | 'outro' | 'frame'
window.render = function(mode, t){
  const isFrame = mode === 'frame';
  $('device').style.display = isFrame ? 'block' : 'none'; $('fw').className = isFrame ? 'holed' : '';
  $('logo').style.display = isFrame ? 'none' : 'block';
  for (const id of ['tag','url','cta','cref']) $(id).style.display = 'none';
  if (isFrame) return;

  const logoY = mode === 'intro' ? 760 : 690;
  $('logo').style.top = logoY + 'px';
  // 1) o pulso se desenha da esquerda para a direita
  $('wr').setAttribute('width', 360 * ease(seg(t, .15, 1.25)));
  // 2) símbolo começa centralizado e maior, depois desliza para a posição do logo
  const m = ease(seg(t, 1.2, 2.0));
  const s = 1.5 - .5*m, tx = 333*(1-m);
  $('all').setAttribute('transform', `translate(500 130) scale(${s}) translate(-500 -130) translate(${tx} 0)`);
  // 3) letras entram em sequência
  letters.forEach((p,i) => { const k = easeOut(seg(t, 1.45 + i*.07, 1.85 + i*.07)); p.style.opacity = k; p.setAttribute('transform', `translate(0 ${26*(1-k)})`); });
  // 4) o ponto do i "pulsa"
  const d = seg(t, 2.0, 2.35); const ds = d <= 0 ? 0 : back(d);
  $('dot').setAttribute('transform', `translate(743 68) scale(${ds}) translate(-743 -68)`);
  const tag = $('tag'); tag.style.display = 'block'; tag.style.top = (logoY + 290) + 'px';
  const kt = easeOut(seg(t, 2.3, 2.9)); show(tag, kt, 20*(1-kt));
  if (mode === 'outro'){
    const u = $('url'); u.style.display='block'; u.style.top = '1130px';
    const ku = easeOut(seg(t, 2.8, 3.4)); show(u, ku, 24*(1-ku));
    // encerramento enxuto: só logo, slogan e site
    if (false) { const c = $('cta'); c.style.display='block'; c.style.top = '1170px';
    const kc = easeOut(seg(t, 3.2, 3.8)); c.style.opacity = kc; c.style.transform = `translateX(-50%) scale(${.92+.08*back(seg(t,3.2,3.8))})`;
    const r = $('cref'); r.style.display='block'; r.style.top = '1560px';
    const kr = easeOut(seg(t, 3.7, 4.3)); show(r, kr, 16*(1-kr)); }
  }
};
</script>
</body></html>
