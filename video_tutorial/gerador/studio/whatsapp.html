<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Color+Emoji&display=block">
<style>
:root{--bg:#0c0c0c;--in:#202222;--out:#154230;--head:#141414;--pill:#1d1f1f;--txt:#f1f2f2;--muted:#8e9696;--green:#21c063;--link:#2fd47c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{width:393px;height:852px;overflow:hidden;background:var(--bg);font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--txt)}
::-webkit-scrollbar{display:none}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 46px;font-weight:600;font-size:17px;z-index:9;transition:color .35s}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px}
.sicons{display:flex;gap:6px;align-items:center}
header{position:absolute;top:0;left:0;right:0;height:116px;padding-top:54px;background:rgba(20,20,20,.97);display:flex;align-items:center;padding-left:12px;padding-right:12px;gap:10px;z-index:4}
.pillbtn{height:44px;min-width:44px;border-radius:22px;background:var(--pill);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#0a2a24;display:flex;align-items:center;justify-content:center}
.name{font-weight:600;font-size:18px;flex:1;letter-spacing:.2px}
#chat{position:absolute;top:116px;bottom:84px;left:0;right:0;overflow-y:auto;padding:10px 0 12px;background-color:var(--bg);background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='150' height='150' fill='none' stroke='%231b1c1c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 30h6m-3-5v10m22-5h14m-17-4v8m20-8v8M36 26v8m26-8v8'/%3E%3Cpath d='M98 20c-4-6-14-2-10 6l10 9 10-9c4-8-6-12-10-6z'/%3E%3Cpath d='M20 80l6 6 12-14 8 18 8-10h10'/%3E%3Ccircle cx='112' cy='82' r='9'/%3E%3Cpath d='M112 76v6l4 3'/%3E%3Cpath d='M60 118l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z'/%3E%3Cpath d='M118 122h16m-8-8v16'/%3E%3Cpath d='M22 124c6-8 14-8 20 0'/%3E%3C/svg%3E");scroll-behavior:auto}
.row{display:flex;padding:0 10px;margin-top:6px}
.row.out{justify-content:flex-end}
.row.first{margin-top:12px}
.b{position:relative;max-width:80%;border-radius:18px;padding:8px 12px 7px;font-size:17px;line-height:1.34;letter-spacing:-.1px;white-space:pre-wrap;word-wrap:break-word}
.in .b{background:var(--in);border-bottom-left-radius:6px}
.out .b{background:var(--out);border-bottom-right-radius:6px}
.t{float:right;font-size:12px;color:var(--muted);margin:10px 0 -4px 12px;line-height:1;white-space:nowrap}
.out .t{color:#9fbcb0}
.ticks{color:#53bdeb;margin-left:3px;font-size:13px;letter-spacing:-4px}
b{font-weight:700}
a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.chip{display:flex;justify-content:center;margin:14px 0 4px}
.chip span{background:#1d1f1f;color:#c9cfcf;font-size:13px;font-weight:500;padding:5px 12px;border-radius:9px}
.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.typing{display:flex;gap:5px;padding:13px 16px!important}
.typing i{width:8px;height:8px;border-radius:50%;background:#9aa3a3;animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.doc{display:flex;gap:10px;align-items:center;background:#2a2e2e;border-radius:12px;padding:10px;margin:-2px -6px 8px;white-space:normal}
.pdf{width:36px;height:44px;border-radius:5px;background:#e5483d;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;flex:none}
.doc .fn{font-size:15px;font-weight:500;line-height:1.25}
.doc .meta{font-size:12px;color:var(--muted);margin-top:3px}
.preview{margin:-4px -8px 8px;border-radius:12px;overflow:hidden;background:#2a2e2e;white-space:normal}
.preview img{display:block;width:100%;height:150px;object-fit:cover}
.preview .pt{font-size:15px;font-weight:600;padding:9px 11px 2px}
.preview .pd{font-size:13.5px;color:#aab3b3;padding:0 11px 6px;line-height:1.3}
.preview .pu{font-size:13px;color:#aab3b3;padding:0 11px 10px}
.audio{display:flex;align-items:center;gap:10px;padding:8px 10px 6px!important;min-width:280px;white-space:normal}
.audio .av{width:50px;height:50px;border-radius:50%;background:linear-gradient(160deg,#5c6b66,#2f3a37);position:relative;flex:none;overflow:hidden}
.audio .av svg{position:absolute;bottom:-4px;left:7px}
.audio .mic{position:absolute;right:-4px;bottom:-2px;font-size:14px}
.audio .wave{display:flex;align-items:center;gap:2px;height:28px;flex:1}
.audio .wave i{width:3px;border-radius:2px;background:#8fb3a3}
.audio .meta{display:flex;justify-content:space-between;font-size:12px;color:#9fbcb0;margin-top:2px}
footer{position:absolute;bottom:0;left:0;right:0;height:84px;background:var(--bg);display:flex;align-items:flex-start;gap:10px;padding:10px 12px 0;z-index:4}
.field{flex:1;height:44px;border-radius:22px;background:#161616;border:1px solid #232525;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;position:relative;overflow:hidden}
.circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
#mic{background:var(--green);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#mic.hold{transform:scale(1.45)}
#lock{position:absolute;right:16px;bottom:96px;width:36px;height:74px;border-radius:18px;background:#1d1f1f;border:1px solid #2a2d2d;
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:6px 0;opacity:0;transform:translateY(24px);
  transition:opacity .25s ease,transform .35s cubic-bezier(.2,1.1,.3,1);z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#lock.on{opacity:1;transform:none}
#lock svg:last-child{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.rec{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 14px;background:#161616;opacity:0;transition:opacity .2s}
.rec.on{opacity:1}
.rec .dot{width:10px;height:10px;border-radius:50%;background:#f0443a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec .slide{margin-left:auto;color:#8e9696;font-size:13.5px;white-space:nowrap}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#f2f2f2;z-index:6}
#viewer{position:absolute;inset:0;background:#f2f2f7;z-index:8;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.8,.2,1);color:#111}
#viewer.open{transform:none}
#viewer .vh{position:absolute;top:0;left:0;right:0;height:112px;padding:58px 14px 0;background:rgba(249,249,251,.97);border-bottom:1px solid #dcdce0;display:flex;align-items:center;gap:10px;z-index:2}
#viewer .vt{flex:1;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .x{width:34px;height:34px;border-radius:50%;background:#e4e4ea;display:flex;align-items:center;justify-content:center;font-size:18px;color:#555}
#viewer .pages{position:absolute;top:112px;bottom:0;left:0;right:0;overflow-y:auto;padding:14px 10px 40px}
#viewer .pages img{display:block;width:100%;transition:transform .9s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:2px}
#viewer .pc{position:absolute;top:122px;left:14px;background:rgba(60,60,67,.75);color:#fff;font-size:13px;padding:4px 10px;border-radius:12px;z-index:3}
</style></head>
<body>
<div class="status" id="status"><span id="clock">9:41</span><div class="island"></div>
  <div class="sicons">
    <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8.5.6 10.2 10.2 0 0 0 1.3 3.5l1.2 1.2a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2a6.8 6.8 0 0 0-9.6 0l1.2 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.4c.5 0 1 .2 1.3.5L8.5 11 7.2 9.6c.3-.3.8-.5 1.3-.5z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
  </div></div>
<header>
  <div class="pillbtn" style="padding:0 12px 0 10px"><svg width="13" height="22" viewBox="0 0 13 22"><path d="M11 2 2 11l9 9" fill="none" stroke="#f1f2f2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="avatar"><svg width="28" height="22" viewBox="18 24 296 226"><path fill="#25E27E" transform="translate(-10 -5)" id="sym"/></svg></div>
  <div class="name">MOVIVO</div>
  <div class="pillbtn" style="width:72px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f1f2f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><svg width="11" height="7" viewBox="0 0 11 7"><path d="m1 1 4.5 4.5L10 1" fill="none" stroke="#f1f2f2" stroke-width="1.8" stroke-linecap="round"/></svg></div>
</header>
<div id="chat"></div>
<footer>
  <div class="circle" style="width:36px"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#f1f2f2" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></svg></div>
  <div class="field"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f1f2f2" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-8-8h8v8z" stroke-linejoin="round"/><path d="M20 12h-4a4 4 0 0 0-4 4v4"/></svg>
    <div class="rec" id="rec"><div class="dot"></div><span id="rect">0:00</span><span class="slide">‹ Deslize para cancelar</span></div></div>
  <div class="circle" style="background:#161616;border:1px solid #232525"><svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="#f1f2f2" stroke-width="1.8" stroke-linejoin="round"><path d="M2 7a2 2 0 0 1 2-2h3l2-3h6l2 3h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/><circle cx="12" cy="12" r="4"/></svg></div>
  <div class="circle" id="mic"><svg width="16" height="23" viewBox="0 0 16 23" fill="none" stroke="#0b1a10" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="1" width="6" height="12.5" rx="3"/><path d="M1.8 10.5a6.2 6.2 0 0 0 12.4 0M8 16.8v4.6"/></svg></div>
  <div id="lock"><svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="#e9eded" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="13" height="10" rx="2.5"/><path d="M5.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5"/></svg>
    <svg width="14" height="9" viewBox="0 0 14 9" fill="none" stroke="#9aa3a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l5-5 5 5"/></svg></div>
</footer>
<div class="home"></div>
<div id="viewer"><div class="vh"><div class="x" id="vx">✕</div><div class="vt" id="vt"></div>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></div>
  <div class="pc">1 de 1</div><div class="pages" id="pages"></div></div>
<script>
const chat = document.getElementById('chat');
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt = (s) => esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/(https?:\/\/\S+)/g,'<a>$1</a>');
const ease = (t) => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
let lastSide = null;
function scrollTo(y, ms = 450) {
  return new Promise((res) => {
    const from = chat.scrollTop, d = Math.max(0, Math.min(y, chat.scrollHeight - chat.clientHeight)) - from, t0 = performance.now();
    if (Math.abs(d) < 1 || ms === 0) { chat.scrollTop = from + d; return res(); }
    const step = (n) => { const k = Math.min(1,(n-t0)/ms); chat.scrollTop = from + d*ease(k); k < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
const bottom = (ms) => scrollTo(chat.scrollHeight, ms);
function row(side, inner, cls = '', animate = true) {
  const r = document.createElement('div');
  r.className = `row ${side}${side !== lastSide ? ' first' : ''}`;
  lastSide = side;
  r.innerHTML = `<div class="b ${cls}">${inner}</div>`;
  if (animate) r.classList.add('enter');
  chat.appendChild(r);
  return r;
}
const time = (t, out) => `<span class="t">${t}${out ? '<span class="ticks">✓✓</span>' : ''}</span>`;
const bars = (n, seed) => { let s = seed, h = ''; for (let i = 0; i < n; i++) { s = (s*9301+49297)%233280; h += `<i style="height:${4+Math.round(20*Math.abs(Math.sin(i*.55+seed))*(.4+.6*s/233280))}px"></i>`; } return h; };
window.wa = {
  chip(text, animate) { const c = document.createElement('div'); c.className = 'chip' + (animate ? ' enter' : ''); c.innerHTML = `<span>${text}</span>`; chat.appendChild(c); lastSide = null; },
  text(side, text, t, animate = true) { return row(side, fmt(text) + time(t, side === 'out'), '', animate); },
  pdf(name, caption, t, animate = true) {
    return row('in', `<div class="doc" data-pdf><div class="pdf">PDF</div><div><div class="fn">${name}</div><div class="meta">1 página · 101 KB · pdf</div></div></div>${fmt(caption)}${time(t)}`, '', animate);
  },
  link(img, title, desc, text, t, animate = true) {
    return row('in', `<div class="preview"><img src="${img}"><div class="pt">${title}</div><div class="pd">${desc}</div><div class="pu">🔗 movivo.com.br</div></div>${fmt(text)}${time(t)}`, '', animate);
  },
  audio(t, secs = 5) {
    const inner = '<div class="av"><svg width="36" height="44" viewBox="0 0 36 44" fill="#c9d3cf"><circle cx="18" cy="13" r="9"/><path d="M0 44c0-11 8-18 18-18s18 7 18 18z"/></svg><span class="mic">🎙️</span></div>'
      + '<div style="flex:1"><div style="display:flex;align-items:center;gap:10px"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M2 1.5v17L17 10z" fill="#c9d6d0"/></svg><div class="wave">' + bars(30, 3) + '</div></div>'
      + '<div class="meta"><span>0:0' + secs + '</span><span>' + t + '<span class="ticks">✓✓</span></span></div></div>';
    return row('out', inner, 'audio');
  },
  typing() { const r = row('in', '<i></i><i></i><i></i>', 'typing'); r.id = 'typing'; return r; },
  untyping() { const r = document.getElementById('typing'); if (r) { r.remove(); lastSide = chat.lastElementChild?.classList.contains('row') ? (chat.lastElementChild.classList.contains('out') ? 'out' : 'in') : null; } },
  clock(t) { document.getElementById('clock').textContent = t; },
  bottom, scrollTo,
  top(el, offset = 12, ms = 600) { return scrollTo(el.offsetTop - offset, ms); },
  async record(secs) {
    document.getElementById('mic').classList.add('hold');
    document.getElementById('lock').classList.add('on');
    document.getElementById('rec').classList.add('on');
    for (let i = 0; i <= secs; i++) { document.getElementById('rect').textContent = `0:0${i}`; if (i < secs) await new Promise((r) => setTimeout(r, 1000)); }
  },
  stopRecord() { document.getElementById('lock').classList.remove('on'); document.getElementById('mic').classList.remove('hold'); document.getElementById('rec').classList.remove('on'); },
  openPdf(name, src) { document.getElementById('vt').textContent = name; document.getElementById('pages').innerHTML = `<img src="${src}">`; document.getElementById('viewer').classList.add('open'); document.getElementById('status').style.color = '#111'; },
  zoomPdf(scale, ox, oy) { const img = document.querySelector('#pages img'); img.style.transformOrigin = `${ox}px ${oy}px`; img.style.transform = scale === 1 ? '' : `scale(${scale})`; },
  closePdf() { document.getElementById('viewer').classList.remove('open'); document.getElementById('status').style.color = ''; },
  scrollPdf(y, ms) { return new Promise((res) => { const el = document.getElementById('pages'); const from = el.scrollTop, d = y - from, t0 = performance.now(); const st = (n) => { const k = Math.min(1,(n-t0)/ms); el.scrollTop = from + d*ease(k); k < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); }); },
};
document.getElementById('sym').setAttribute('d', window.SYMBOL_D || '');
</script>
</body></html>
