# Production-ready override. All paths are relative to the first Compose file.
x-http-tls: &http-tls
  image: nginx:1.30.5-alpine
  restart: unless-stopped
  profiles: [app]
  security_opt: [no-new-privileges:true]
  entrypoint: [sh, /etc/movivo/http-tls.sh]
  volumes:
    - ./infra/security/http-tls.sh:/etc/movivo/http-tls.sh:ro
    - ./infra/security/http-tls.conf:/etc/movivo/http-tls.conf:ro
  healthcheck:
    test: [CMD-SHELL, 'nginx -t -c /tmp/nginx.conf -q']
    interval: 15s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits: {memory: 64M, cpus: '0.15'}

services:
  postgres:
    entrypoint: [sh, /etc/movivo/postgres-tls.sh]
    volumes:
      - ./infra/security/postgres-tls.sh:/etc/movivo/postgres-tls.sh:ro
      - ./infra/security/pg_hba.conf:/etc/movivo/pg_hba.conf:ro
    secrets:
      - internal_ca
      - postgres_tls_key
      - postgres_tls_cert
    tmpfs: [/tmp/tls]
  evolution-postgres:
    entrypoint: [sh, /etc/movivo/postgres-tls.sh]
    volumes:
      - ./infra/security/postgres-tls.sh:/etc/movivo/postgres-tls.sh:ro
      - ./infra/security/pg_hba.conf:/etc/movivo/pg_hba.conf:ro
    secrets:
      - internal_ca
      - source: evolution_postgres_tls_key
        target: postgres_tls_key
      - source: evolution_postgres_tls_cert
        target: postgres_tls_cert
    tmpfs: [/tmp/tls]
  pgbouncer:
    user: '0:0'
    entrypoint: [sh, /etc/movivo/pgbouncer-tls.sh]
    volumes:
      - ./infra/security/pgbouncer-tls.sh:/etc/movivo/pgbouncer-tls.sh:ro
    secrets: [internal_ca, pgbouncer_tls_key, pgbouncer_tls_cert]
    tmpfs: [/tmp]
  redis-master:
    command: [sh, /etc/movivo/redis-tls.sh, redis-master]
    volumes:
      - ./infra/security/redis-tls.sh:/etc/movivo/redis-tls.sh:ro
    secrets:
      - internal_ca
      - source: redis_master_tls_cert
        target: redis_tls_cert
      - source: redis_master_tls_key
        target: redis_tls_key
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --tls --cacert /run/secrets/internal_ca --sni redis-master ping | grep -qx PONG']
  redis-replica:
    command: [sh, /etc/movivo/redis-tls.sh, redis-replica]
    volumes:
      - ./infra/security/redis-tls.sh:/etc/movivo/redis-tls.sh:ro
    secrets:
      - internal_ca
      - source: redis_replica_tls_cert
        target: redis_tls_cert
      - source: redis_replica_tls_key
        target: redis_tls_key
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --tls --cacert /run/secrets/internal_ca --sni redis-replica info replication | grep -q "master_link_status:up"']
  redis-sentinel:
    command: [sh, /etc/movivo/redis-tls.sh, sentinel]
    environment:
      REDIS_TLS_PORT: '26379'
    volumes:
      - ./infra/security/redis-tls.sh:/etc/movivo/redis-tls.sh:ro
    secrets:
      - internal_ca
      - source: redis_sentinel_tls_cert
        target: redis_tls_cert
      - source: redis_sentinel_tls_key
        target: redis_tls_key
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --tls --cacert /run/secrets/internal_ca --sni redis-sentinel -p 26379 sentinel master movivo-master | grep -qx movivo-master']
  evolution-api:
    environment:
      SERVER_TYPE: https
      SSL_CONF_PRIVKEY: /run/secrets/evolution_api_tls_key
      SSL_CONF_FULLCHAIN: /run/secrets/evolution_api_tls_cert
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_ca
    command:
      - bash
      - -c
      - |
        set -eu
        test -s /run/secrets/evolution_api_tls_key
        test -s /run/secrets/evolution_api_tls_cert
        export AUTHENTICATION_API_KEY="$$(cat /run/secrets/evolution_api_key)"
        export DATABASE_CONNECTION_URI="postgresql://evolution:$$(cat /run/secrets/evolution_postgres_password)@evolution-postgres:5432/evolution?sslmode=require&sslcert=/run/secrets/internal_ca&sslaccept=strict"
        exec bash -c '. ./Docker/scripts/deploy_database.sh && npm run start:prod'
    secrets: [internal_ca, evolution_api_tls_key, evolution_api_tls_cert]
    healthcheck:
      test: [CMD-SHELL, 'node -e "fetch(\"https://localhost:8080/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
  vault:
    image: hashicorp/vault:2.1.1@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2
    container_name: movivo-vault
    user: '0:0'
    restart: unless-stopped
    networks: [movivo-net]
    memswap_limit: 512m
    environment:
      GOMEMLIMIT: 256MiB
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /run/secrets/internal_ca
    entrypoint: [sh, /etc/movivo/vault-tls.sh]
    volumes:
      - vault-data:/vault/data
      - ./infra/security/vault.hcl:/vault/config/movivo.hcl:ro
      - ./infra/security/vault-tls.sh:/etc/movivo/vault-tls.sh:ro
    tmpfs: [/tmp/tls]
    secrets: [internal_ca, vault_tls_cert, vault_tls_key]
    ports: ['127.0.0.1:8200:8200']
    healthcheck:
      test: [CMD, vault, status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 512M, cpus: '0.35'}
  vault-token-renewer:
    image: hashicorp/vault:2.1.1@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2
    container_name: movivo-vault-token-renewer
    restart: unless-stopped
    networks: [movivo-net]
    depends_on:
      vault: {condition: service_healthy}
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /run/secrets/internal_ca
    secrets: [internal_ca, vault_token]
    entrypoint: [sh, -c]
    command:
      - |
        export VAULT_TOKEN="$$(cat /run/secrets/vault_token)"
        while :; do
          vault token renew >/dev/null 2>&1 || exit 1
          sleep 3600
        done
    deploy:
      resources:
        limits: {memory: 64M, cpus: '0.10'}
  migrate:
    environment:
      MIGRATION_DATABASE_SSL: 'true'
      MIGRATION_DATABASE_SSL_CA_FILE: /run/secrets/internal_ca
    secrets: [internal_ca]
  api:
    environment:
      HTTP_BIND_HOST: ${HTTP_BIND_HOST:-127.0.0.1}
      API_PUBLIC_URL: ${MOVIVO_INTERNAL_API_PUBLIC_URL:-https://api.movivo.com.br}
      DATABASE_SSL: 'true'
      DATABASE_SSL_CA_FILE: /run/secrets/internal_ca
      REDIS_TLS_ENABLED: 'true'
      REDIS_TLS_CA_FILE: /run/secrets/internal_ca
      HEALTH_CIPHER_PROVIDER: VAULT
      HEALTH_CIPHER_KEY_ID: health-2026-q4
      HEALTH_CIPHER_KEYRING_FILE: /run/secrets/health_cipher_keyring
      VAULT_ADDR: https://vault:8200
      VAULT_CA_FILE: /run/secrets/internal_ca
      VAULT_TOKEN_FILE: /run/secrets/vault_token
      VAULT_TRANSIT_KEY: movivo-health
      EVOLUTION_API_URL: https://evolution-api:8080
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_ca
    secrets: [internal_ca, health_cipher_keyring, vault_token]
    depends_on:
      vault: {condition: service_healthy}
  web:
    environment:
      HOSTNAME: ${MOVIVO_WEB_BIND_HOST:-127.0.0.1}
      MOVIVO_API_URL: https://api:3443/api/v1
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_ca
    secrets: [internal_ca]
  api-tls:
    <<: *http-tls
    container_name: movivo-api-tls
    network_mode: service:api
    depends_on:
      api: {condition: service_started}
    environment: {TLS_PORT: '3443', UPSTREAM_PORT: '3001'}
    secrets:
      - source: api_tls_cert
        target: http_tls_cert
      - source: api_tls_key
        target: http_tls_key
  web-tls:
    <<: *http-tls
    container_name: movivo-web-tls
    network_mode: service:web
    depends_on:
      web: {condition: service_started}
    environment: {TLS_PORT: '3444', UPSTREAM_PORT: '3000'}
    secrets:
      - source: web_tls_cert
        target: http_tls_cert
      - source: web_tls_key
        target: http_tls_key

volumes:
  vault-data:
    name: movivo-vault-data

secrets:
  internal_ca: {file: ./secrets/internal_tls/ca.crt}
  postgres_tls_cert: {file: ./secrets/internal_tls/postgres.crt}
  postgres_tls_key: {file: ./secrets/internal_tls/postgres.key}
  evolution_postgres_tls_cert: {file: ./secrets/internal_tls/evolution-postgres.crt}
  evolution_postgres_tls_key: {file: ./secrets/internal_tls/evolution-postgres.key}
  pgbouncer_tls_cert: {file: ./secrets/internal_tls/pgbouncer.crt}
  pgbouncer_tls_key: {file: ./secrets/internal_tls/pgbouncer.key}
  redis_master_tls_cert: {file: ./secrets/internal_tls/redis-master.crt}
  redis_master_tls_key: {file: ./secrets/internal_tls/redis-master.key}
  redis_replica_tls_cert: {file: ./secrets/internal_tls/redis-replica.crt}
  redis_replica_tls_key: {file: ./secrets/internal_tls/redis-replica.key}
  redis_sentinel_tls_cert: {file: ./secrets/internal_tls/redis-sentinel.crt}
  redis_sentinel_tls_key: {file: ./secrets/internal_tls/redis-sentinel.key}
  vault_tls_cert: {file: ./secrets/internal_tls/vault.crt}
  vault_tls_key: {file: ./secrets/internal_tls/vault.key}
  api_tls_cert: {file: ./secrets/internal_tls/api.crt}
  api_tls_key: {file: ./secrets/internal_tls/api.key}
  web_tls_cert: {file: ./secrets/internal_tls/web.crt}
  web_tls_key: {file: ./secrets/internal_tls/web.key}
  evolution_api_tls_cert: {file: ./secrets/internal_tls/evolution-api.crt}
  evolution_api_tls_key: {file: ./secrets/internal_tls/evolution-api.key}
  health_cipher_keyring: {file: ./secrets/health_cipher_keyring}
  vault_token: {file: ./secrets/vault_token}
