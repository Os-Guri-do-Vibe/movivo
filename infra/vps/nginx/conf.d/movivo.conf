# =============================================================================
# MOVIVO — Nginx de borda da origem (atrás do Cloudflare, SSL Full strict)
# =============================================================================
# Dono: Henrique (Platform/SRE)
#
# Incluído no bloco `http` do nginx.conf padrão da imagem. Os dois .inc com as
# faixas do Cloudflare são GERADOS pelo deploy.sh a partir de
# https://www.cloudflare.com/ips-v4 e ips-v6 — não edite à mão.
#
# Camadas de proteção da origem, de fora para dentro:
#   1. Firewall da Hostinger: 443 só das faixas IPv4 do Cloudflare.
#   2. Aqui: qualquer conexão que não venha do Cloudflare leva 444 (sem
#      resposta) — cobre o caso de o filtro da borda falhar ou ser trocado.
#   3. SNI desconhecido nem completa o handshake TLS (default_server).
# =============================================================================

server_tokens off;

# IP real do visitante. O header só é aceito quando a conexão vem de uma faixa
# do Cloudflare; o Express (`trust proxy` = 1) lê o X-Forwarded-For montado
# abaixo com um único salto — o rate limit por IP depende disso.
include /etc/nginx/conf.d/cloudflare-realip.inc;
real_ip_header CF-Connecting-IP;

# $realip_remote_addr = endereço da conexão ANTES da troca pelo IP do visitante.
geo $realip_remote_addr $from_cloudflare {
    default 0;
    include /etc/nginx/conf.d/cloudflare-geo.inc;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Resolver do Docker: com proxy_pass por variável, o nome do container é
# resolvido a cada requisição (IP novo após um recreate não vira 502), e o
# Nginx sobe mesmo que a API ainda não exista.
resolver 127.0.0.11 valid=10s ipv6=off;

ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Sobrescreve (não concatena): o que o visitante mandar nesse header é descartado.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 5s;
proxy_read_timeout    90s;

# SNI/Host desconhecido: recusa o handshake (não entrega nem o certificado).
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.movivo.com.br;
    if ($from_cloudflare = 0) { return 444; }
    return 301 https://movivo.com.br$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name movivo.com.br;
    if ($from_cloudflare = 0) { return 444; }

    client_max_body_size 3m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Plataforma Interna: mudou de path pra subdomínio próprio (admin.movivo.com.br).
    # Não redireciona de propósito — essas rotas não devem responder nada aqui,
    # nem confirmar que já existiram neste host.
    location ^~ /entrar {
        return 404;
    }

    location ^~ /dashboard {
        return 404;
    }

    location ^~ /api/dashboard {
        return 404;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.movivo.com.br;
    if ($from_cloudflare = 0) { return 444; }

    # Plataforma Interna (login + dashboard CREF). Mesma imagem/app do site público
    # (web:3000) — o Next.js é quem sabe renderizar /entrar e /dashboard, aqui só se
    # decide QUAIS rotas esse host expõe. Tudo fora da lista cai no 404 no fim do
    # arquivo: este subdomínio nunca deve servir landing, anamnese, etc.
    client_max_body_size 3m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Raiz do subdomínio já abre no login, sem precisar digitar /entrar.
    # `set` vem antes do `rewrite ... break`: o `break` para a execução das demais
    # diretivas do módulo rewrite (inclusive `set`) na mesma location, não só do regex.
    location = / {
        set $web_upstream http://web:3000;
        rewrite ^/$ /entrar break;
        proxy_pass $web_upstream;
    }

    location ^~ /entrar {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }

    location ^~ /dashboard {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }

    location ^~ /api/dashboard {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }

    # Estáticos do Next.js e assets usados pela tela de login/dashboard (logo, ícone).
    location ^~ /_next/ {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }

    location ^~ /brand/ {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }

    location = /icon.svg {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }

    location = /favicon.ico {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.movivo.com.br;
    if ($from_cloudflare = 0) { return 444; }

    # JSON até 2 MB (DEFAULT_JSON_BODY_LIMIT) e avatar até 2 MB em multipart.
    client_max_body_size 3m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
    }
}

# Healthcheck do próprio container (só loopback, nunca publicado).
server {
    listen 127.0.0.1:8080;
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
